[project]
name = "propdata"
version = "0.1.0"
description = "Normalised worldwide property detail collection"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
propdata = "propdata.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["propdata*"]
